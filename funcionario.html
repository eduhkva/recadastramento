<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila de Espera</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    label, select, button {
      font-size: 18px;
      margin: 10px 0;
      width: 100%;
      padding: 10px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fila de Espera</h1>

    <label for="guiche-select">Escolha o guichê:</label>
    <select id="guiche-select">
      <option value="01">Guichê 01</option>
      <option value="02">Guichê 02</option>
      <option value="03">Guichê 03</option>
      <option value="04">Guichê 04</option>
      <option value="05">Guichê 05</option>
      <option value="06">Guichê 06</option>
      <option value="07">Guichê 07</option>
      <option value="08">Guichê 08</option>
    </select>

    <button id="chamar-senha-button">Chamar Próxima Senha</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(); // Conecta ao servidor

    // Evento para chamar a próxima senha
    document.getElementById('chamar-senha-button').addEventListener('click', function() {
      const guiche = document.getElementById('guiche-select').value; // Pega o guichê selecionado

      // Emite o evento para chamar a próxima senha
      socket.emit('chamar-senha', guiche);
    });
  </script>
</body>
</html>
